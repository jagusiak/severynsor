<div class="relative flex items-center w-full group">
    <input 
        type="{{ widget.type }}" 
        name="{{ widget.name }}" 
        {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}
        {% include "django/forms/widgets/attrs.html" %} 
        class="border font-medium px-3 py-2 rounded-md shadow-sm text-sm w-full pr-11 focus:ring focus:ring-primary-300 focus:border-primary-600 dark:bg-base-900 dark:border-base-700 dark:text-gray-200 dark:focus:ring-primary-900 dark:focus:border-primary-500"
    >
    <button 
        type="button" 
        onclick="togglePasswordVisibility(this)" 
        class="absolute right-3 flex items-center text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 transition-colors z-10"
        title="Toggle visibility"
    >
        <span class="material-symbols-outlined text-[20px]">visibility</span>
    </button>
</div>
